<main class="home">
    <picture class="hero-background" aria-hidden="true">
        <source media="(max-width: 600px)" srcset="/Images/home/MeridaMovil.webp">
        <img
            src="/Images/home/MeridaDesktop.webp"
            alt=""
            width="1920"
            height="1080"
            fetchpriority="high"
            decoding="async"
        >
    </picture>

    <section class="hero">
        <div class="hero-content">
            <div class="logo-container">
                <img
                    class="brand-logo"
                    src="/Images/brand/LogoIn1.webp"
                    alt="Noma Mid Inmobiliaria Digital"
                    width="768"
                    height="512"
                    decoding="async"
                >
            </div>

            <p class="eyebrow">
                Bienes raíces en Mérida, Yucatán
            </p>

            <h1>
                Encuentra tu lugar
                <span>en Mérida</span>
            </h1>

            <p class="description">
                Casas, departamentos y terrenos seleccionados para vivir, invertir y construir con confianza.
            </p>

            <div class="actions">
                <a class="primary-button" routerLink="/propiedades">
                    <span>Explorar propiedades</span>
                </a>
            </div>
        </div>
    </section>
</main>
