<div class="detail-overlay">
    <article
        class="detail-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="property-detail-title"
    >
        <button
            class="detail-close"
            type="button"
            aria-label="Cerrar detalle de la propiedad"
            (click)="requestClose()"
        >
            &times;
        </button>

        <section class="detail-gallery" aria-label="Imágenes de la propiedad">
            <div class="detail-gallery__main">
                <img
                    class="detail-gallery__image"
                    [src]="activeImage.src"
                    [alt]="activeImage.alt"
                    [class.is-zoomed]="zoomLevel > 1"
                    [class.is-dragging]="isDragging"
                    [style.transform]="imageTransform"
                    loading="eager"
                    decoding="async"
                    draggable="false"
                    (dblclick)="toggleZoom()"
                    (wheel)="handleWheel($event)"
                    (pointerdown)="startPan($event)"
                    (pointermove)="movePan($event)"
                    (pointerup)="endPan($event)"
                    (pointercancel)="endPan($event)"
                >

                <button
                    class="detail-arrow detail-arrow--previous"
                    type="button"
                    aria-label="Mostrar imagen anterior"
                    (click)="showPreviousImage()"
                >
                    &larr;
                </button>
                <button
                    class="detail-arrow detail-arrow--next"
                    type="button"
                    aria-label="Mostrar imagen siguiente"
                    (click)="showNextImage()"
                >
                    &rarr;
                </button>

                <div class="detail-zoom" aria-label="Controles de zoom">
                    <button
                        type="button"
                        aria-label="Alejar imagen"
                        [disabled]="zoomLevel <= 1"
                        (click)="zoomOut()"
                    >
                        &minus;
                    </button>
                    <button
                        class="detail-zoom__level"
                        type="button"
                        title="Restablecer zoom"
                        aria-label="Restablecer imagen al tamaño original"
                        (click)="resetZoom()"
                    >
                        {{ zoomPercentage }}%
                    </button>
                    <button
                        type="button"
                        aria-label="Acercar imagen"
                        [disabled]="zoomLevel >= 4"
                        (click)="zoomIn()"
                    >
                        &plus;
                    </button>
                </div>
            </div>

            <div class="detail-thumbnails" aria-label="Seleccionar imagen">
                @for (image of property.images; track image.src; let index = $index) {
                    <button
                        #thumbnailButton
                        class="detail-thumbnail"
                        type="button"
                        [class.is-active]="index === currentImageIndex"
                        [attr.aria-label]="'Mostrar imagen ' + (index + 1)"
                        [attr.aria-current]="index === currentImageIndex ? 'true' : null"
                        (click)="selectImage(index)"
                    >
                        <img
                            class="detail-thumbnail__image"
                            [src]="image.src"
                            [alt]="image.alt"
                            loading="lazy"
                            decoding="async"
                            draggable="false"
                        >
                        <span class="detail-thumbnail__number" aria-hidden="true">
                            {{ index + 1 < 10 ? '0' + (index + 1) : index + 1 }}
                        </span>
                    </button>
                }
            </div>
        </section>

        <section class="detail-information">
            <p class="detail-category">{{ property.category }}</p>
            <h2 id="property-detail-title">{{ property.title }}</h2>
            <p class="detail-location">{{ property.location }}</p>
            <div class="detail-line" aria-hidden="true"></div>
            <p class="detail-description">{{ property.fullDescription }}</p>

            <div class="detail-features">
                <p>Características</p>
                <ul>
                    @for (feature of property.features; track feature) {
                        <li>{{ feature }}</li>
                    }
                </ul>
            </div>
        </section>
    </article>
</div>
